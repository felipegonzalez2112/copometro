<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#f8f5f0" />
    <meta name="description" content="Descubrí qué tragos podés preparar según las bebidas e ingredientes que tenés en casa." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./chinchin-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./chinchin-icon.svg" />
    <script>
      try {
        const preference = localStorage.getItem('chinchin.theme.v1');
        const resolved = preference === 'light' || preference === 'dark' ? preference : (preference === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : 'light');
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('#theme-color')?.setAttribute('content', resolved === 'light' ? '#f8f5f0' : '#171412');
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css?v=15" />
    <title>ChinChin — Recomendador de tragos</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./app.js?v=15" defer></script>
  </body>
</html>
